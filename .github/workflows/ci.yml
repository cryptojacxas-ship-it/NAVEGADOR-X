name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
11d5960a326750d5838078e36cf38b85af677262actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
49933ea5288caeca8642d1e84afbd3f7d6820020actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # El binario de Electron no hace falta para compilar ni para el typecheck.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build Electron shell
        run: npm run build:electron

