name: Deploy web edition (GitHub Pages)

# Publica la edición web (SPA) en https://jacxas.github.io/NAVEGADOR-X/.
#
# Requisito, una sola vez y a mano: Settings → Pages → Build and deployment →
# Source: GitHub Actions. El token de Actions no puede habilitar Pages por sí
# mismo (la API devuelve 403 «Resource not accessible by integration»).
#
# Mientras Pages no esté habilitado, este workflow **no falla**: compila, avisa en
# el resumen del job y se salta el despliegue. Así el CI deja de llenarse de
# despliegues rojos (los cuatro que había eran de antes de retirar el workflow
# anterior) y el día que se habilite, el siguiente push publica sin tocar nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
11d5960a326750d5838078e36cf38b85af677262actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
49933ea5288caeca8642d1e84afbd3f7d6820020actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # El binario de Electron no hace falta para compilar la web.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 404 = el sitio nunca se creó. Cualquier otro código (200, o un 403 de
          # permisos puntual) se trata como «sí», para no saltarse un despliegue
          # real por un fallo transitorio de la API.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")

          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages no está habilitado"
              echo
              echo "El build web se ha generado, pero no se despliega porque el sitio no existe."
              echo "Para publicarlo: **Settings → Pages → Build and deployment → Source: GitHub Actions**."
              echo "Después, vuelve a ejecutar este workflow (\`workflow_dispatch\`) o haz un push a \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Pages no habilitado::Ve a Settings → Pages y elige «GitHub Actions» como origen. Este workflow empezará a publicar solo."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages responde $status: se desplegará tras el build."
          fi

      - name: Build renderer
        run: npm run build

      - name: Verify the build works under a subpath
        # Pages sirve en /NAVEGADOR-X/: si Vite volviera a un `base` absoluto,
        # todos los recursos darían 404 y nadie se enteraría hasta abrir la web.
        run: npm run check:pages

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
983d7736d9b0ae728b81ab479565c72886d7745bactions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true'
56afc609e74202658d3ffba0e8f6dda462b719faactions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
